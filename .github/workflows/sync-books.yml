name: Sync new books

# Checks the reading-tracker Google Sheet (published CSV of the Books
# tab) for rows not yet in data/books.csv. If there are none, the job
# exits early and costs nothing. If there are, it fetches metadata/tags/
# embeddings for JUST those new books (scripts 1-4 already skip anything
# already cached) for all 4 provider/text-variant combinations the site
# ships, and rebuilds the plot, then commits the result.
#
# This workflow itself only commits to `main` -- deploying is
# .github/workflows/deploy-pages.yml's job. That workflow triggers on
# `push: branches: [main]`, but GitHub deliberately does NOT fire other
# workflows' push triggers for a push made with a workflow's own
# built-in GITHUB_TOKEN (anti-recursion safeguard) -- so this workflow's
# own commits would silently never deploy without the explicit
# `gh workflow run deploy-pages.yml` below. Invoking it via the API like
# this is a different code path (workflow_dispatch) that isn't subject
# to that restriction.

on:
  schedule:
    # Off the top of the hour on purpose: GitHub load-sheds scheduled runs
    # (minute 0 is the busiest) and was only firing "0 * * * *" every
    # ~5-9h. Even off-peak, schedule is best-effort, not guaranteed.
    - cron: "23 * * * *" # hourly, at :23
  workflow_dispatch: {}

# Only one sync should ever be mutating data/books.csv and pushing at a
# time -- without this, two overlapping runs (more likely the tighter
# the cron interval) could race to commit/push and one would fail.
concurrency:
  group: sync-books
  cancel-in-progress: false

permissions:
  contents: write
  actions: write # needed to trigger deploy-pages.yml, see note above

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the sheet for new books
        env:
          BOOKS_SHEET_CSV_URL: ${{ secrets.BOOKS_SHEET_CSV_URL }}
        run: |
          pip install requests
          python scripts/00_sync_books.py

      - name: Decide whether there's anything to do
        id: diff
        run: |
          if git diff --quiet -- data/books.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pipeline dependencies
        if: steps.diff.outputs.changed == 'true'
        run: pip install -r requirements.txt

      - name: Fetch metadata for new books
        if: steps.diff.outputs.changed == 'true'
        env:
          # Optional; without it Google Books' keyless quota (shared with
          # everyone else on the runner's IP) is usually exhausted.
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: python scripts/01_fetch_metadata.py

      - name: Merge metadata
        if: steps.diff.outputs.changed == 'true'
        run: python scripts/02_extract_metadata.py

      - name: Generate tags for new books
        if: steps.diff.outputs.changed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/03_generate_tags.py

      - name: Embed new books (all provider/text-variant combinations)
        if: steps.diff.outputs.changed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/04_generate_embeddings.py --provider local --text-variant v1
          python scripts/04_generate_embeddings.py --provider local --text-variant v2
          python scripts/04_generate_embeddings.py --provider openai --text-variant v1 --model text-embedding-3-large
          python scripts/04_generate_embeddings.py --provider openai --text-variant v2 --model text-embedding-3-large

      # Commit the data first, then rebase onto whatever landed on main
      # while this run was busy (e.g. a code push), and only THEN rebuild
      # the plot -- so the push can't be rejected as non-fast-forward, and
      # output/ is always built from the latest 05_visualize.py rather than
      # conflicting with a concurrently pushed output/.
      - name: Commit data and rebase onto latest main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/books.csv data/book_metadata.json data/book_tags.json \
                  data/embedding_input_v1.json data/embedding_input_v2.json \
                  data/embeddings_local_v1.npz data/embeddings_local_v2.npz \
                  data/embeddings_openai_v1.npz data/embeddings_openai_v2.npz \
                  cache/
          git commit -m "Sync new books from reading list"
          git pull --rebase origin main

      - name: Rebuild the plot
        if: steps.diff.outputs.changed == 'true'
        run: python scripts/05_visualize.py

      - name: Commit plot and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add output/
          git commit --amend --no-edit
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (main moved again); rebasing and retrying..."
            git pull --rebase origin main || exit 1
          done
          exit 1

      - name: Trigger the Pages deploy
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "${{ github.repository }}"
