name: Deploy to GitHub Pages

# Publishes output/ (the pre-built plot -- see scripts/05_visualize.py)
# to GitHub Pages on every push to main. Unlike the old Netlify setup,
# Pages deploys aren't metered/credited, so there's no need to throttle
# this -- it can just run on every push, including the hourly book-sync
# workflow's commits.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy are separate jobs (GitHub's recommended Pages
  # layout), not two steps of one job: when deploy-pages ran in the same
  # job right after the upload, it sometimes listed the run's artifacts
  # before the just-uploaded one was visible ("No artifacts named
  # github-pages were found"), failing the deploy even though the upload
  # had succeeded. A separate job starts only after the upload job has
  # fully finished.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
